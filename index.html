<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDFHub — Conversor de Alta Fidelidade</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF.js (Leitura vetorial, coordenadas, fontes e renderização HD) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- DOCX.js (Geração de arquivo .docx OOXML real com tabelas, estilos e imagens) -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <!-- SheetJS (Geração e leitura de planilhas .xlsx) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- PptxGenJS (Geração de apresentações .pptx) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
  <!-- Mammoth.js (Leitura fiel de .docx para conversão inversa Word -> PDF) -->
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <!-- html2pdf / jsPDF (Geração de PDF vetorial a partir de Word/Excel) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-4 sm:p-8 font-sans">

  <div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 sm:p-8 space-y-6">
    <div class="border-b border-slate-100 pb-4">
      <h1 class="text-xl sm:text-2xl font-bold text-slate-900">Conversor de Documentos — Alta Fidelidade</h1>
      <p class="text-sm text-slate-600 mt-1">
        Preservação de estrutura original, retenção automática de gráficos/imagens, filtragem de marcas d'água diagonais e renderização em alta definição.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">1. Selecione o arquivo</label>
        <input id="fileInput" type="file" accept=".pdf,.docx,.xlsx,.xls,.csv"
               class="block w-full text-sm text-slate-700 border border-slate-200 rounded-xl p-2 bg-slate-50 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer" />
      </div>

      <div>
        <label class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">2. Conversão desejada</label>
        <select id="conversionMode" class="w-full rounded-xl border border-slate-300 px-3 py-3 text-sm bg-white font-medium text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="pdf-to-docx-structured">PDF → Word (.docx) — Texto Editável + Tabelas + Imagens</option>
          <option value="pdf-to-docx-exact">PDF → Word (.docx) — Fidelidade Visual 100% (Layout Exato)</option>
          <option value="pdf-to-xlsx">PDF → Excel (.xlsx) — Grade Tabular Inteligente</option>
          <option value="pdf-to-pptx">PDF → PowerPoint (.pptx) — Slides em Alta Definição</option>
          <option value="docx-to-pdf">Word (.docx) → PDF — Formatação e Imagens Preservadas</option>
          <option value="xlsx-to-pdf">Excel (.xlsx) → PDF — Tabela Ajustada à Página</option>
        </select>
      </div>
    </div>

    <div class="bg-blue-50/70 border border-blue-100 rounded-xl p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs text-slate-700">
      <label class="flex items-center gap-2 cursor-pointer">
        <input id="cleanNoise" type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500" />
        <span>Remover marcas d'água diagonais e cabeçalhos repetidos</span>
      </label>
      <label class="flex items-center gap-2 cursor-pointer">
        <input id="ultraDpi" type="checkbox" checked class="rounded text-blue-600 focus:ring-blue-500" />
        <span>Escala Ultra HD (3.0x / ~216 DPI) para imagens e slides</span>
      </label>
    </div>

    <div class="flex items-center justify-between pt-2">
      <span id="fileMeta" class="text-xs text-slate-500">Nenhum arquivo carregado.</span>
      <button id="convertBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-sm px-6 py-3 rounded-xl shadow-sm transition">
        Converter Arquivo
      </button>
    </div>

    <div id="statusBox" class="hidden text-xs font-medium rounded-xl p-4 bg-slate-100 text-slate-700 border border-slate-200"></div>
  </div>

  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const fileInput = document.getElementById('fileInput');
    const fileMeta = document.getElementById('fileMeta');
    const statusBox = document.getElementById('statusBox');

    fileInput.addEventListener('change', () => {
      const f = fileInput.files[0];
      fileMeta.textContent = f ? `${f.name} (${(f.size / 1024).toFixed(1)} KB)` : 'Nenhum arquivo carregado.';
    });

    function setStatus(msg, isError = false) {
      statusBox.textContent = msg;
      statusBox.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-slate-100', 'text-slate-700');
      if (isError) {
        statusBox.classList.add('bg-red-50', 'text-red-700', 'border-red-200');
      } else {
        statusBox.classList.add('bg-slate-100', 'text-slate-700');
      }
    }

    function triggerDownload(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    }

    /**
     * 1. EXTRAÇÃO VETORIAL COM DETECÇÃO DE ROTAÇÃO, NEGRITO, COORDENADAS E PRESENÇA DE IMAGENS/GRÁFICOS
     */
    async function parsePdfStructure(arrayBuffer, removeNoise = true) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pagesData = [];
      const repeatedHeadersFooters = new Map();
      const OPS = pdfjsLib.OPS;

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.0 });
        const textContent = await page.getTextContent();
        const opList = await page.getOperatorList();

        // Detecta imagens embutidas ou desenhos vetoriais complexos (gráficos/diagramas) na página
        let vectorPathOps = 0;
        let hasRasterImage = false;
        for (const fn of opList.fnArray) {
          if (
            fn === OPS.paintImageXObject ||
            fn === OPS.paintInlineImageXObject ||
            fn === OPS.paintImageMaskXObject
          ) {
            hasRasterImage = true;
          } else if (fn === OPS.constructPath) {
            vectorPathOps++;
          }
        }
        const hasVisualFigure = hasRasterImage || vectorPathOps > 25;

        const rawItems = [];
        for (const item of textContent.items) {
          if (!item.str || !item.str.trim()) continue;

          const [a, b, , , x, y] = item.transform;
          // Filtra marcas d'água diagonais (ângulo diferente de 0° ou 180°)
          const angleDeg = Math.abs(Math.atan2(b, a) * (180 / Math.PI));
          const isRotatedWatermark = angleDeg > 10 && angleDeg < 170;
          if (removeNoise && isRotatedWatermark) continue;

          const fontSize = Math.round(Math.hypot(a, b)) || 11;
          const fontName = (item.fontName || '').toLowerCase();
          const isBold = fontName.includes('bold') || fontName.includes('black') || fontName.includes('heavy');
          const topY = Number((viewport.height - y).toFixed(1));
          const leftX = Number(x.toFixed(1));
          const cleanStr = item.str.replace(/\s+/g, ' ').trim();

          // Ignora números isolados de página nas extremidades superior/inferior
          const isPageNumber = /^(Página\s*)?\d{1,3}$/i.test(cleanStr) && (topY < 48 || topY > viewport.height - 48);
          if (removeNoise && isPageNumber) continue;

          if (topY < 68 || topY > viewport.height - 68) {
            repeatedHeadersFooters.set(cleanStr, (repeatedHeadersFooters.get(cleanStr) || 0) + 1);
          }

          rawItems.push({
            str: cleanStr,
            x: leftX,
            y: topY,
            width: item.width || cleanStr.length * (fontSize * 0.5),
            fontSize,
            isBold
          });
        }

        pagesData.push({
          pageNum,
          width: viewport.width,
          height: viewport.height,
          hasVisualFigure,
          items: rawItems
        });
      }

      // Remove cabeçalhos/rodapés repetitivos entre múltiplas páginas
      if (removeNoise && pdf.numPages > 1) {
        for (const page of pagesData) {
          page.items = page.items.filter((it) => {
            const isEdge = it.y < 68 || it.y > page.height - 68;
            if (isEdge && (repeatedHeadersFooters.get(it.str) || 0) >= 2) {
              return false;
            }
            return true;
          });
        }
      }

      return pagesData;
    }

    /**
     * 2. RENDERIZA PÁGINA DO PDF EM PNG DE ALTA DEFINIÇÃO (BYTES + DATA URL)
     */
    async function renderPdfPageAsPng(arrayBuffer, pageNum, scale = 3.0) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);

      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#FFFFFF';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({ canvasContext: ctx, viewport }).promise;

      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/png', 1.0));
      const bytes = new Uint8Array(await blob.arrayBuffer());
      const dataUrl = canvas.toDataURL('image/png', 1.0);

      return {
        bytes,
        dataUrl,
        widthPts: viewport.width / scale,
        heightPts: viewport.height / scale
      };
    }

    /**
     * 3. RECONSTRUÇÃO INTELIGENTE DE PARÁGRAFOS, QUESTÕES, ALTERNATIVAS E TABELAS PARA DOCX
     */
    function buildDocxElementsForPage(page) {
      const { Paragraph, TextRun, Table, TableRow, TableCell, WidthType, BorderStyle, AlignmentType } = window.docx;
      const elements = [];

      const sorted = [...page.items].sort((a, b) => (Math.abs(a.y - b.y) > 4 ? a.y - b.y : a.x - b.x));

      const lines = [];
      for (const item of sorted) {
        const last = lines[lines.length - 1];
        if (last && Math.abs(item.y - last.y) <= Math.max(4, item.fontSize * 0.45)) {
          last.parts.push(item);
          last.y = (last.y + item.y) / 2;
        } else {
          lines.push({ y: item.y, fontSize: item.fontSize, parts: [item] });
        }
      }

      let i = 0;
      let paragraphRuns = [];
      let prevLineY = null;

      const flushParagraph = (isHeading = false, indentLeft = 0) => {
        if (!paragraphRuns.length) return;
        elements.push(
          new Paragraph({
            children: paragraphRuns,
            alignment: isHeading ? AlignmentType.LEFT : AlignmentType.JUSTIFIED,
            indent: indentLeft ? { left: indentLeft } : undefined,
            spacing: {
              before: isHeading ? 180 : 40,
              after: isHeading ? 80 : 110,
              line: 276
            }
          })
        );
        paragraphRuns = [];
      };

      while (i < lines.length) {
        const line = lines[i];
        line.parts.sort((a, b) => a.x - b.x);

        const hasPipeSeparator = line.parts.some((p) => p.str === '|');
        const colSplits = [];
        let currentColText = '';
        for (let k = 0; k < line.parts.length; k++) {
          const part = line.parts[k];
          if (part.str === '|') {
            colSplits.push(currentColText.trim());
            currentColText = '';
            continue;
          }
          if (k > 0) {
            const prev = line.parts[k - 1];
            const gap = part.x - (prev.x + prev.width);
            if (gap > 38 && !hasPipeSeparator) {
              colSplits.push(currentColText.trim());
              currentColText = part.str;
              continue;
            }
          }
          currentColText += (currentColText ? ' ' : '') + part.str;
        }
        if (currentColText.trim()) colSplits.push(currentColText.trim());

        if (colSplits.length >= 2 && (hasPipeSeparator || colSplits.every((c) => c.length < 60))) {
          flushParagraph();
          const tableRows = [];
          while (i < lines.length) {
            const l = lines[i];
            l.parts.sort((a, b) => a.x - b.x);
            const rowText = l.parts.map((p) => p.str).join(' ');
            const cellsText = rowText.includes('|')
              ? rowText.split('|').map((s) => s.trim()).filter(Boolean)
              : l.parts.reduce((acc, p, idx) => {
                  if (idx === 0) return [p.str];
                  const prev = l.parts[idx - 1];
                  if (p.x - (prev.x + prev.width) > 35) acc.push(p.str);
                  else acc[acc.length - 1] += ' ' + p.str;
                  return acc;
                }, []);

            if (cellsText.length < 2) break;

            tableRows.push(
              new TableRow({
                children: cellsText.map(
                  (cellStr) =>
                    new TableCell({
                      width: { size: Math.floor(100 / cellsText.length), type: WidthType.PERCENTAGE },
                      borders: {
                        top: { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' },
                        bottom: { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' },
                        left: { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' },
                        right: { style: BorderStyle.SINGLE, size: 4, color: 'CBD5E1' }
                      },
                      children: [
                        new Paragraph({
                          children: [new TextRun({ text: cellStr, font: 'Calibri', size: 20 })],
                          spacing: { before: 40, after: 40 }
                        })
                      ]
                    })
                )
              })
            );
            i++;
          }

          if (tableRows.length) {
            elements.push(new Table({ rows: tableRows, width: { size: 100, type: WidthType.PERCENTAGE } }));
            elements.push(new Paragraph({ text: '', spacing: { after: 80 } }));
          }
          prevLineY = null;
          continue;
        }

        const fullLineText = line.parts.map((p) => p.str).join(' ').trim();
        const isQuestionHeader = /^(Questão\s*\d+|\d{1,2}\.\s+|PROVA\s+DE\s+|TEXTO\s+\d+)/i.test(fullLineText);
        const isAlternative = /^([a-eA-E]\)|[I|V|X]+\s*[-–.])\s*/.test(fullLineText);
        const isAllBold = line.parts.every((p) => p.isBold);
        const verticalGap = prevLineY !== null ? line.y - prevLineY : 0;

        if (
          isQuestionHeader ||
          isAlternative ||
          (isAllBold && fullLineText.length < 95) ||
          verticalGap > Math.max(16, line.fontSize * 1.45)
        ) {
          flushParagraph();
        }

        if (paragraphRuns.length > 0) {
          paragraphRuns.push(new TextRun({ text: ' ', font: 'Calibri', size: 22 }));
        }

        for (let pIdx = 0; pIdx < line.parts.length; pIdx++) {
          const part = line.parts[pIdx];
          paragraphRuns.push(
            new TextRun({
              text: (pIdx > 0 ? ' ' : '') + part.str,
              bold: part.isBold || isQuestionHeader,
              font: 'Calibri',
              size: isQuestionHeader ? 23 : 22
            })
          );
        }

        if (isQuestionHeader || isAlternative || (isAllBold && fullLineText.length < 95)) {
          flushParagraph(isQuestionHeader, isAlternative ? 360 : 0);
          prevLineY = null;
        } else {
          prevLineY = line.y;
        }

        i++;
      }

      flushParagraph();
      return elements;
    }

    /**
     * 4. RECONSTRUÇÃO DE GRADE EXCEL POR COORDENADAS X/Y
     */
    function extractExcelGridFromPage(page) {
      const items = [...page.items].sort((a, b) => (Math.abs(a.y - b.y) > 5 ? a.y - b.y : a.x - b.x));
      if (!items.length) return [['']];

      const colClusters = [];
      for (const it of items) {
        const match = colClusters.find((c) => Math.abs(c.x - it.x) < 24);
        if (match) {
          match.x = (match.x * match.count + it.x) / (match.count + 1);
          match.count++;
        } else {
          colClusters.push({ x: it.x, count: 1 });
        }
      }
      colClusters.sort((a, b) => a.x - b.x);

      const rows = [];
      let currentRow = null;
      let currentY = null;

      for (const it of items) {
        if (currentY === null || Math.abs(it.y - currentY) > 7) {
          if (currentRow) rows.push(currentRow);
          currentRow = new Array(colClusters.length).fill('');
          currentY = it.y;
        }
        let bestIdx = 0;
        let minDiff = Infinity;
        colClusters.forEach((col, idx) => {
          const diff = Math.abs(it.x - col.x);
          if (diff < minDiff) {
            minDiff = diff;
            bestIdx = idx;
          }
        });
        currentRow[bestIdx] = currentRow[bestIdx] ? `${currentRow[bestIdx]} ${it.str}` : it.str;
      }
      if (currentRow) rows.push(currentRow);

      return rows.map((r) => r.filter((_, idx) => rows.some((row) => row[idx] !== '')));
    }

    /**
     * EXECUTOR PRINCIPAL
     */
    document.getElementById('convertBtn').addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) {
        setStatus('Selecione um arquivo antes de converter.', true);
        return;
      }

      const mode = document.getElementById('conversionMode').value;
      const removeNoise = document.getElementById('cleanNoise').checked;
      const scale = document.getElementById('ultraDpi').checked ? 3.0 : 2.0;
      const baseName = file.name.replace(/\.[^.]+$/, '');

      try {
        setStatus('Analisando estrutura, gráficos e layout do documento...');
        const buffer = await file.arrayBuffer();

        // A) PDF -> WORD EDITÁVEL + TABELAS + IMAGENS RETIDAS (.DOCX REAL)
        if (mode === 'pdf-to-docx-structured') {
          const pages = await parsePdfStructure(buffer.slice(0), removeNoise);
          const { Document, Packer, Paragraph, TextRun, ImageRun, PageBreak } = window.docx;
          const allChildren = [];

          for (let idx = 0; idx < pages.length; idx++) {
            const p = pages[idx];
            setStatus(`Processando página ${p.pageNum} de ${pages.length}...`);
            allChildren.push(...buildDocxElementsForPage(p));

            // Sempre que a página tiver imagem ou gráfico vetorial, anexa a representação visual HD
            if (p.hasVisualFigure) {
              const rendered = await renderPdfPageAsPng(buffer.slice(0), p.pageNum, scale);
              const targetWidth = 540;
              const targetHeight = Math.round(targetWidth * (rendered.heightPts / rendered.widthPts));

              allChildren.push(
                new Paragraph({
                  spacing: { before: 140, after: 60 },
                  children: [
                    new TextRun({
                      text: `[Referência visual — elementos gráficos da página ${p.pageNum}]`,
                      italics: true,
                      color: '64748B',
                      size: 18,
                      font: 'Calibri'
                    })
                  ]
                }),
                new Paragraph({
                  spacing: { before: 40, after: 160 },
                  children: [
                    new ImageRun({
                      data: rendered.bytes,
                      transformation: { width: targetWidth, height: targetHeight }
                    })
                  ]
                })
              );
            }

            if (idx < pages.length - 1) {
              allChildren.push(new Paragraph({ children: [new PageBreak()] }));
            }
          }

          const doc = new Document({
            sections: [{
              properties: { page: { margin: { top: 720, bottom: 720, left: 850, right: 850 } } },
              children: allChildren
            }]
          });

          const blob = await Packer.toBlob(doc);
          triggerDownload(blob, `${baseName}_editavel.docx`);
          setStatus('Concluído! Arquivo .docx gerado com texto estruturado, tabelas e imagens preservadas.');
        }

        // B) PDF -> WORD COM FIDELIDADE VISUAL EXATA (100% IGUAL AO ORIGINAL)
        else if (mode === 'pdf-to-docx-exact') {
          const pdf = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise;
          const { Document, Packer, Paragraph, ImageRun } = window.docx;
          const sections = [];

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            setStatus(`Renderizando página ${pageNum} de ${pdf.numPages} em alta definição...`);
            const rendered = await renderPdfPageAsPng(buffer.slice(0), pageNum, scale);

            sections.push({
              properties: {
                page: {
                  size: { width: Math.round(rendered.widthPts * 20), height: Math.round(rendered.heightPts * 20) },
                  margin: { top: 0, bottom: 0, left: 0, right: 0 }
                }
              },
              children: [
                new Paragraph({
                  spacing: { before: 0, after: 0 },
                  children: [
                    new ImageRun({
                      data: rendered.bytes,
                      transformation: {
                        width: Math.round(rendered.widthPts * 1.333),
                        height: Math.round(rendered.heightPts * 1.333)
                      }
                    })
                  ]
                })
              ]
            });
          }

          const doc = new Document({ sections });
          const blob = await Packer.toBlob(doc);
          triggerDownload(blob, `${baseName}_layout_exato.docx`);
          setStatus('Concluído! Documento .docx gerado preservando 100% do layout e imagens do PDF.');
        }

        // C) PDF -> EXCEL (.XLSX)
        else if (mode === 'pdf-to-xlsx') {
          const pages = await parsePdfStructure(buffer.slice(0), removeNoise);
          const wb = XLSX.utils.book_new();

          pages.forEach((p) => {
            const grid = extractExcelGridFromPage(p);
            const ws = XLSX.utils.aoa_to_sheet(grid);
            ws['!cols'] = (grid[0] || []).map((_, cIdx) => {
              const maxChars = grid.reduce((m, row) => Math.max(m, String(row[cIdx] || '').length), 10);
              return { wch: Math.min(maxChars + 5, 60) };
            });
            XLSX.utils.book_append_sheet(wb, ws, `Pagina_${p.pageNum}`);
          });

          XLSX.writeFile(wb, `${baseName}_planilha.xlsx`);
          setStatus('Concluído! Planilha .xlsx gerada com alinhamento por colunas e ajuste de largura.');
        }

        // D) PDF -> POWERPOINT (.PPTX)
        else if (mode === 'pdf-to-pptx') {
          const pdf = await pdfjsLib.getDocument({ data: buffer.slice(0) }).promise;
          const pptx = new window.PptxGenJS();

          for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            setStatus(`Convertendo slide ${pageNum} de ${pdf.numPages} em alta definição...`);
            const rendered = await renderPdfPageAsPng(buffer.slice(0), pageNum, scale);
            const isPortrait = rendered.heightPts > rendered.widthPts;
            const slideW = isPortrait ? 7.5 : 13.333;
            const slideH = isPortrait ? 10.0 : 7.5;

            pptx.defineLayout({ name: `CUSTOM_${pageNum}`, width: slideW, height: slideH });
            pptx.layout = `CUSTOM_${pageNum}`;

            const slide = pptx.addSlide();
            slide.addImage({ data: rendered.dataUrl, x: 0, y: 0, w: slideW, h: slideH });
          }

          await pptx.writeFile({ fileName: `${baseName}_apresentacao.pptx` });
          setStatus('Concluído! Apresentação .pptx gerada na proporção exata das páginas e com imagens nítidas.');
        }

        // E) WORD (.DOCX) -> PDF (COM IMAGENS EMBUTIDAS PRESERVADAS)
        else if (mode === 'docx-to-pdf') {
          const result = await window.mammoth.convertToHtml(
            { arrayBuffer: buffer },
            {
              convertImage: window.mammoth.images.imgElement((image) =>
                image.read('base64').then((imageBuffer) => ({
                  src: `data:${image.contentType};base64,${imageBuffer}`
                }))
              )
            }
          );

          const container = document.createElement('div');
          container.innerHTML = `
            <div style="font-family: 'Calibri', 'Arial', sans-serif; font-size: 11.5pt; line-height: 1.5; color: #1e293b; padding: 10px;">
              <style>
                table { border-collapse: collapse; width: 100%; margin: 12px 0; }
                td, th { border: 1px solid #94a3b8; padding: 6px 8px; }
                img { max-width: 100%; height: auto; display: block; margin: 10px auto; }
                p { margin-bottom: 10px; text-align: justify; }
              </style>
              ${result.value}
            </div>
          `;

          await html2pdf()
            .set({
              margin: [15, 15, 15, 15],
              filename: `${baseName}.pdf`,
              image: { type: 'png', quality: 1.0 },
              html2canvas: { scale: 2.5, useCORS: true, allowTaint: true },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
            })
            .from(container)
            .save();

          setStatus('Concluído! PDF gerado a partir do Word com tabelas e imagens preservadas.');
        }

        // F) EXCEL (.XLSX) -> PDF
        else if (mode === 'xlsx-to-pdf') {
          const wb = XLSX.read(buffer, { type: 'array' });
          const ws = wb.Sheets[wb.SheetNames[0]];
          const htmlTable = XLSX.utils.sheet_to_html(ws);

          const container = document.createElement('div');
          container.innerHTML = `
            <div style="font-family: Arial, sans-serif; font-size: 10pt; padding: 8px;">
              <style>
                table { border-collapse: collapse; width: 100%; }
                td, th { border: 1px solid #cbd5e1; padding: 5px 8px; text-align: left; }
                tr:nth-child(even) { background-color: #f8fafc; }
              </style>
              ${htmlTable}
            </div>
          `;

          await html2pdf()
            .set({
              margin: [10, 10, 10, 10],
              filename: `${baseName}.pdf`,
              image: { type: 'png', quality: 1.0 },
              html2canvas: { scale: 2.5 },
              jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' }
            })
            .from(container)
            .save();

          setStatus('Concluído! PDF gerado em modo paisagem A4 ajustado à largura da planilha.');
        }
      } catch (err) {
        console.error(err);
        setStatus(`Falha ao converter: ${err.message || 'verifique se o formato do arquivo corresponde à opção escolhida.'}`, true);
      }
    });
  </script>
</body>
</html>
