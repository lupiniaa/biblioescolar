<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conversor Otimizado — PDF / Word / Excel / PowerPoint</title>
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- PDF.js (leitura e renderização de alta resolução de PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <!-- SheetJS (geração de planilhas XLSX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- DOCX.js (geração de documentos Word DOCX) -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <!-- PptxGenJS (geração de apresentações PowerPoint PPTX) -->
  <script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 p-6">
  <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-5">
    <div>
      <h1 class="text-xl font-bold text-slate-900">Conversor Otimizado de Documentos</h1>
      <p class="text-sm text-slate-600 mt-1">
        Agrupamento inteligente de parágrafos, detecção de grade tabular para Excel e alta resolução de renderização.
      </p>
    </div>

    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Arquivo de entrada</label>
        <input id="fileInput" type="file" accept=".pdf,.xlsx,.xls,.csv,.txt"
               class="block w-full text-sm text-slate-700 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
      </div>

      <div>
        <label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Formato de saída</label>
        <select id="targetFormat" class="w-full rounded-lg border-slate-300 border px-3 py-2 text-sm bg-white">
          <option value="docx">PDF → Word (.docx) [Parágrafos agrupados]</option>
          <option value="xlsx">PDF → Excel (.xlsx) [Grade por coordenadas]</option>
          <option value="pptx">PDF → PowerPoint (.pptx) [Slides + Alta DPI]</option>
          <option value="pdf-from-sheet">Planilha/CSV → PDF (.pdf) [Tabela estruturada]</option>
        </select>
      </div>
    </div>

    <div class="flex items-center justify-between gap-4 pt-2">
      <label class="inline-flex items-center gap-2 text-xs text-slate-600">
        <input id="highQualityScale" type="checkbox" checked class="rounded border-slate-300 text-blue-600" />
        Renderização em alta escala (2.2x / ~158 DPI) para maior nitidez
      </label>

      <button id="convertBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-5 py-2.5 rounded-xl transition">
        Converter com qualidade
      </button>
    </div>

    <div id="statusBox" class="text-xs text-slate-600 bg-slate-100 rounded-xl p-3 hidden"></div>
  </div>

  <script>
    const pdfjsLib = window['pdfjs-dist/build/pdf'];
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const statusBox = document.getElementById('statusBox');
    const setStatus = (msg) => {
      statusBox.textContent = msg;
      statusBox.classList.remove('hidden');
    };

    /**
     * Extrai itens de texto com posição (x, y, altura) preservando a ordem visual da página.
     */
    async function extractStructuredPdfPages(arrayBuffer) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const pages = [];

      for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
        const page = await pdf.getPage(pageNum);
        const viewport = page.getViewport({ scale: 1.0 });
        const textContent = await page.getTextContent();

        const items = textContent.items
          .filter((item) => item.str && item.str.trim() !== '')
          .map((item) => {
            const [, , , , x, y] = item.transform;
            return {
              str: item.str.replace(/\s+/g, ' ').trim(),
              x: Number(x.toFixed(1)),
              // Converte coordenada Y de baixo para cima para topo -> base
              y: Number((viewport.height - y).toFixed(1)),
              height: Number((item.height || Math.abs(item.transform[0]) || 11).toFixed(1))
            };
          })
          // Ordena de cima para baixo e depois da esquerda para a direita
          .sort((a, b) => {
            const yDiff = a.y - b.y;
            if (Math.abs(yDiff) > 4) return yDiff;
            return a.x - b.x;
          });

        pages.push({ pageNum, width: viewport.width, height: viewport.height, items });
      }

      return pages;
    }

    /**
     * Agrupa fragmentos de texto em linhas e parágrafos reais (reduz quebra de linha artificial).
     */
    function groupItemsIntoParagraphs(items) {
      if (!items.length) return [];

      const lines = [];
      for (const item of items) {
        const currentLine = lines[lines.length - 1];
        if (!currentLine) {
          lines.push({ y: item.y, height: item.height, parts: [item] });
          continue;
        }

        const tolerance = Math.max(4, Math.min(currentLine.height, item.height) * 0.45);
        if (Math.abs(item.y - currentLine.y) <= tolerance) {
          currentLine.parts.push(item);
          currentLine.y = (currentLine.y + item.y) / 2;
        } else {
          lines.push({ y: item.y, height: item.height, parts: [item] });
        }
      }

      const paragraphs = [];
      let buffer = '';
      let prevLine = null;

      for (const line of lines) {
        line.parts.sort((a, b) => a.x - b.x);
        let lineText = '';
        let prevPart = null;

        for (const part of line.parts) {
          if (prevPart) {
            const gap = part.x - (prevPart.x + prevPart.str.length * (prevPart.height * 0.42));
            if (gap > 14 && !lineText.endsWith('\t')) {
              lineText += '   ';
            } else if (!lineText.endsWith(' ')) {
              lineText += ' ';
            }
          }
          lineText += part.str;
          prevPart = part;
        }

        lineText = lineText.trim();
        if (!lineText) continue;

        if (!prevLine) {
          buffer = lineText;
        } else {
          const verticalGap = line.y - prevLine.y;
          const normalLineSpacing = Math.max(12, prevLine.height * 1.45);
          const endsSentence = /[.!?:;]$/.test(buffer);
          const startsNewSection = /^[A-ZÁÉÍÓÚÂÊÔÃÕÇ0-9IVX]+[\).\-\s]/.test(lineText) && lineText.length < 70;

          if (verticalGap > normalLineSpacing * 1.35 || (endsSentence && startsNewSection)) {
            paragraphs.push(buffer);
            buffer = lineText;
          } else {
            buffer += (buffer.endsWith('-') ? '' : ' ') + lineText;
          }
        }
        prevLine = line;
      }

      if (buffer) paragraphs.push(buffer);
      return paragraphs;
    }

    /**
     * Reconstrói grade tabular usando clusters de posição horizontal (X) para melhorar o Excel.
     */
    function buildTableRowsFromItems(items) {
      if (!items.length) return [];

      const xPositions = items.map((i) => i.x).sort((a, b) => a - b);
      const columns = [];
      const colThreshold = 22;

      for (const x of xPositions) {
        const lastCol = columns[columns.length - 1];
        if (!lastCol || Math.abs(x - lastCol.center) > colThreshold) {
          columns.push({ center: x, count: 1, sum: x });
        } else {
          lastCol.count += 1;
          lastCol.sum += x;
          lastCol.center = lastCol.sum / lastCol.count;
        }
      }

      const activeCols = columns
        .filter((c) => c.count >= 2)
        .sort((a, b) => a.center - b.center);

      // Se não houver grade clara, cai para linhas agrupadas
      if (activeCols.length < 2) {
        return groupItemsIntoParagraphs(items).map((text) => [text]);
      }

      const rowsMap = new Map();
      for (const item of items) {
        const rowKey = Math.round(item.y / 8);
        if (!rowsMap.has(rowKey)) {
          rowsMap.set(rowKey, new Array(activeCols.length).fill(''));
        }

        let bestColIdx = 0;
        let minDist = Infinity;
        activeCols.forEach((col, idx) => {
          const dist = Math.abs(item.x - col.center);
          if (dist < minDist) {
            minDist = dist;
            bestColIdx = idx;
          }
        });

        const existing = rowsMap.get(rowKey)[bestColIdx];
        rowsMap.get(rowKey)[bestColIdx] = existing ? `${existing} ${item.str}`.trim() : item.str;
      }

      return Array.from(rowsMap.entries())
        .sort((a, b) => a[0] - b[0])
        .map(([, row]) => row)
        .filter((row) => row.some((cell) => cell !== ''));
    }

    /**
     * Renderiza página do PDF em canvas de alta resolução para apoio visual em slides.
     */
    async function renderPageHighResDataUrl(arrayBuffer, pageNum, scale = 2.2) {
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = Math.floor(viewport.width);
      canvas.height = Math.floor(viewport.height);
      const ctx = canvas.getContext('2d', { alpha: false });
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      await page.render({ canvasContext: ctx, viewport }).promise;
      return canvas.toDataURL('image/png', 1.0);
    }

    function downloadBlob(blob, filename) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
    }

    document.getElementById('convertBtn').addEventListener('click', async () => {
      const file = document.getElementById('fileInput').files[0];
      const format = document.getElementById('targetFormat').value;
      const scale = document.getElementById('highQualityScale').checked ? 2.2 : 1.25;

      if (!file) {
        setStatus('Selecione um arquivo antes de iniciar a conversão.');
        return;
      }

      try {
        setStatus('Processando estrutura do documento com otimização de layout...');
        const baseName = file.name.replace(/\.[^.]+$/, '');
        const buffer = await file.arrayBuffer();

        if (format === 'docx') {
          const pages = await extractStructuredPdfPages(buffer);
          const { Document, Packer, Paragraph, TextRun, HeadingLevel } = window.docx;
          const children = [];

          for (const p of pages) {
            children.push(
              new Paragraph({
                text: `Página ${p.pageNum}`,
                heading: HeadingLevel.HEADING_2,
                spacing: { before: 200, after: 100 }
              })
            );

            const paragraphs = groupItemsIntoParagraphs(p.items);
            for (const text of paragraphs) {
              children.push(
                new Paragraph({
                  children: [new TextRun({ text, font: 'Calibri', size: 22 })],
                  spacing: { after: 140, line: 276 }
                })
              );
            }
          }

          const doc = new Document({ sections: [{ children }] });
          const blob = await Packer.toBlob(doc);
          downloadBlob(blob, `${baseName}_otimizado.docx`);
          setStatus('Arquivo DOCX gerado com agrupamento de parágrafos.');
        } else if (format === 'xlsx') {
          const pages = await extractStructuredPdfPages(buffer);
          const wb = XLSX.utils.book_new();

          for (const p of pages) {
            const rows = buildTableRowsFromItems(p.items);
            const ws = XLSX.utils.aoa_to_sheet(rows);
            // Ajusta largura automática das colunas para evitar truncamento
            ws['!cols'] = (rows[0] || []).map((_, colIdx) => {
              const maxLen = rows.reduce((acc, r) => Math.max(acc, String(r[colIdx] || '').length), 12);
              return { wch: Math.min(maxLen + 4, 55) };
            });
            XLSX.utils.book_append_sheet(wb, ws, `Pagina_${p.pageNum}`);
          }

          XLSX.writeFile(wb, `${baseName}_otimizado.xlsx`);
          setStatus('Planilha XLSX gerada com alinhamento de colunas e ajuste de largura.');
        } else if (format === 'pptx') {
          const pages = await extractStructuredPdfPages(buffer.slice(0));
          const pptx = new window.PptxGenJS();
          pptx.layout = 'LAYOUT_WIDE';

          for (const p of pages) {
            const slide = pptx.addSlide();
            const imgData = await renderPageHighResDataUrl(buffer.slice(0), p.pageNum, scale);
            // Insere visualização de alta nitidez ocupando o slide com margem limpa
            slide.addImage({ data: imgData, x: 0.4, y: 0.35, w: 12.5, h: 6.8 });
          }

          await pptx.writeFile({ fileName: `${baseName}_alta_qualidade.pptx` });
          setStatus('Apresentação PPTX gerada em alta resolução.');
        } else if (format === 'pdf-from-sheet') {
          const wb = XLSX.read(buffer, { type: 'array' });
          const firstSheet = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });

          // Renderiza tabela limpa em canvas de alta resolução e dispara impressão/exportação ou gera PDF simples
          const printWindow = window.open('', '_blank');
          const htmlRows = rows
            .map(
              (r) =>
                `<tr>${r
                  .map(
                    (c) =>
                      `<td style="border:1px solid #cbd5e1;padding:6px 10px;font-size:12px;">${String(
                        c ?? ''
                      )}</td>`
                  )
                  .join('')}</tr>`
            )
            .join('');

          printWindow.document.write(`
            <html><head><title>${baseName}</title>
            <style>@page { size: A4 landscape; margin: 12mm; } body { font-family: Arial, sans-serif; } table { border-collapse: collapse; width: 100%; }</style>
            </head><body><table>${htmlRows}</table><script>window.print();<\/script></body></html>
          `);
          printWindow.document.close();
          setStatus('Visualização de impressão aberta em paisagem A4 para salvar como PDF nítido.');
        }
      } catch (err) {
        console.error(err);
        setStatus(`Erro na conversão: ${err.message || 'verifique o arquivo selecionado.'}`);
      }
    });
  </script>
</body>
</html>
